name: Build CalSmash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Remove incomplete android folder if present
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Inject calendar permissions into AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            # Ensure READ_CALENDAR and WRITE_CALENDAR are present
            if ! grep -q 'android.permission.READ_CALENDAR' "$MANIFEST"; then
              # Insert permissions before the application tag using a temp file
              awk 'BEGIN{inserted=0} /<application/ && !inserted { print "    <uses-permission android:name=\"android.permission.READ_CALENDAR\" />"; print "    <uses-permission android:name=\"android.permission.WRITE_CALENDAR\" />"; inserted=1 } {print}' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
            fi
            echo "Permissions injected (or already present)"
            grep -n "CALENDAR" "$MANIFEST" || true
          else
            echo "AndroidManifest.xml not found"
            exit 1
          fi

      - name: Install app icons from comic-burst pack
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          # Density-specific launcher icons (fallback when adaptive is removed)
          cp www/icons/comic-burst-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/icons/comic-burst-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/icons/comic-burst-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/icons/comic-burst-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/icons/comic-burst-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp www/icons/comic-burst-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp www/icons/comic-burst-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp www/icons/comic-burst-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp www/icons/comic-burst-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp www/icons/comic-burst-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          # Adaptive icon foreground
          cp www/icons/comic-burst-512.png android/app/src/main/res/drawable/ic_launcher_foreground.png
          # Remove adaptive icon XML so the density PNGs are used as the launcher icon
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Comic burst icons installed (adaptive XML removed so PNGs take effect)"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36 and accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Force compileSdk 36 and newer AGP
        run: |
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*35/compileSdkVersion = 36/g' \
            -e 's/compileSdkVersion[[:space:]]*35/compileSdkVersion 36/g' \
            -e 's/targetSdk[[:space:]]*=[[:space:]]*35/targetSdk = 36/g' \
            -e 's/targetSdkVersion[[:space:]]*=[[:space:]]*35/targetSdkVersion = 36/g' \
            -e 's/targetSdkVersion[[:space:]]*35/targetSdkVersion 36/g' \
            {} +
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/com.android.tools.build:gradle:8\.7\.[0-9]*/com.android.tools.build:gradle:8.9.1/g' \
            -e 's/agp_version[[:space:]]*=[[:space:]]*"8\.7\.[0-9]*"/agp_version = "8.9.1"/g' \
            {} +

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalSmash-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release and attach APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CalSmash v${{ github.run_number }}
          body: |
            Debug APK built from commit ${{ github.sha }}
            Download the APK below and install on your Android device.
            You may need to allow installation from unknown sources.
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
