name: Build CalSmash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Remove incomplete android folder if present
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36 and accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Force compileSdk 36 and newer AGP
        run: |
          echo "=== Gradle files before patch ==="
          find android -name "*.gradle" -o -name "*.gradle.kts" | head -20
          # Patch all common locations
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*35/compileSdkVersion = 36/g' \
            -e 's/compileSdkVersion[[:space:]]*35/compileSdkVersion 36/g' \
            -e 's/targetSdk[[:space:]]*=[[:space:]]*35/targetSdk = 36/g' \
            -e 's/targetSdkVersion[[:space:]]*=[[:space:]]*35/targetSdkVersion = 36/g' \
            -e 's/targetSdkVersion[[:space:]]*35/targetSdkVersion 36/g' \
            {} +
          # Bump AGP if present in build.gradle or settings
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            -e 's/com.android.tools.build:gradle:8\.7\.[0-9]*/com.android.tools.build:gradle:8.9.1/g' \
            -e 's/agp_version[[:space:]]*=[[:space:]]*"8\.7\.[0-9]*"/agp_version = "8.9.1"/g' \
            {} +
          echo "=== variables.gradle (if exists) ==="
          cat android/variables.gradle 2>/dev/null || true
          echo "=== app/build.gradle snippet ==="
          head -40 android/app/build.gradle 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalSmash-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release and attach APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CalSmash v${{ github.run_number }}
          body: |
            Debug APK built from commit ${{ github.sha }}
            Download the APK below and install on your Android device.
            You may need to allow installation from unknown sources.
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
